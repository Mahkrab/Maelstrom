schema_version = 2
name = "shallow-tank"
description = "A shallow rectangular body starts with horizontal momentum"
randomness = "none"

[configuration]
source = "file"
path = "config.toml"

[run]
duration_s = 3.0

[container]
min_m = [0.0, 0.0, 0.0]
max_m = [1.6, 0.9, 1.2]

[particles]
construction = "groups"

[[particles.groups]]
name = "water"
construction = "lattice"
origin_m = [0.08, 0.04, 0.08]
counts = [28, 6, 20]
endpoint_rule = "counted_half_open"
order = "x_then_y_then_z"
initial_velocity_m_s = [0.6, 0.0, 0.0]
