schema_version = 2
name = "large-impact-model"
description = "Reference numerical model for large-impact; spacing is inherited by every particle group"

[numerical]
particle_spacing_m = 0.02
fixed_timestep_s = 0.0020833333333333333
solver_iterations = 8
correction_scale = 0.0625
relaxation_scale = 20.0
external_acceleration_m_s2 = [0.0, -9.81, 0.0]
xsph_viscosity_enabled = false
vorticity_confinement_enabled = false
