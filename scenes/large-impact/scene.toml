schema_version = 2
name = "large-impact"
description = "110592 particles in a dense falling block for CUDA rendering"
randomness = "none"

[configuration]
source = "file"
path = "config.toml"

[run]
duration_s = 3.0

[container]
min_m = [0.0, 0.0, 0.0]
max_m = [1.5, 1.8, 1.5]

[particles]
construction = "groups"

[[particles.groups]]
name = "block"
construction = "lattice"
origin_m = [0.12, 0.72, 0.12]
counts = [48, 48, 48]
endpoint_rule = "counted_half_open"
order = "x_then_y_then_z"
initial_velocity_m_s = [0.0, 0.0, 0.0]
