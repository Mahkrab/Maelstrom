[package]
name = "maelstrom"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = []

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
ctrlc = { version = "3.5.2", default-features = false }
rayon = { version = "1.12.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = { version = "0.11.1", default-features = false }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
