[package]
name = "maelstrom"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = []
render = ["dep:wgpu", "dep:pollster", "dep:png"]
viewer = ["render", "dep:winit", "dep:font8x8", "dep:xkbcommon-dl", "dep:toml_edit"]

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions", "color"] }
clap_complete = { version = "4.6.11", default-features = false }
ctrlc = { version = "3.5.2", default-features = false }
rayon = { version = "1.12.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = { version = "0.11.1", default-features = false }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "display"] }
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"], optional = true }

wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "gles", "wgsl"], optional = true }
pollster = { version = "0.4.0", optional = true }
png = { version = "=0.18.1", default-features = false, optional = true }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true }
font8x8 = { version = "0.3.1", default-features = false, features = ["std", "unicode"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
xkbcommon-dl = { version = "0.4.2", default-features = false, features = ["x11"], optional = true }

[build-dependencies]
sha2 = { version = "0.11.1", default-features = false }
